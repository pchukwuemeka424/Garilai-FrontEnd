# Default Nixpacks plan = all-in-one.
# For Coolify split apps, point each resource at:
#   deploy/backend/Dockerfile  or  deploy/frontend/Dockerfile
# (or copy deploy/*/nixpacks.toml as needed).

providers = ["node"]

[variables]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
PORT = "3141"

[phases.install]
cmds = [
  "npm ci",
  "npm ci --prefix backend",
]

[phases.build]
cmds = [
  "npm run build",
  "npx tsc -p backend/tsconfig.json",
]

[start]
cmd = "node backend/dist/index.js"
