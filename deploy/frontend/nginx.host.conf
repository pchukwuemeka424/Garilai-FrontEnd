# Host nginx — static site + optional same-domain API proxy
# Option A (split domains): serve only static; set NEXT_PUBLIC_FEYNMAN_BACKEND at build time
# Option B (same domain): uncomment the /api and /ws proxy blocks below

server {
	listen 80;
	listen [::]:80;
	server_name WEB_DOMAIN;

	root /var/www/garil-ai/out;
	index index.html;

	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	# --- Optional: same-origin API (no NEXT_PUBLIC_FEYNMAN_BACKEND needed) ---
