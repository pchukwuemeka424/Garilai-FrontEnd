# Container nginx — serves Next.js static export (out/)
# listen port is injected by docker-entrypoint.sh from $PORT (Coolify)

server {
	listen __PORT__;
	listen [::]:__PORT__;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Next export: /path → /path.html or /path/index.html
	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	# Fingerprinted Next assets can be immutable; keep image cache shorter so
	# marketing PNG updates are not stuck behind Cloudflare for a full week.
	location ~* \.(js|css|woff2?)$ {
		expires 7d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
		expires 1h;
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		try_files $uri =404;
	}

	# Health for Coolify / load balancers
	location = /healthz {
		access_log off;
		return 200 "ok\n";
		add_header Content-Type text/plain;
	}
}
