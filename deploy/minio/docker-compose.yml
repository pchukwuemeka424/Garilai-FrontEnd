# S3-compatible object storage (MinIO) for VPS / local use.
# Usage:
#   cp deploy/minio/.env.example deploy/minio/.env   # edit secrets
#   docker compose -f deploy/minio/docker-compose.yml --env-file deploy/minio/.env up -d
#
# On Coolify VPS (recommended): sudo bash deploy/minio/setup-vps.sh

services:
  minio:
    image: minio/minio:latest
    container_name: garil-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://127.0.0.1:9000}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: garil-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-garil}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Waiting for MinIO..."
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then echo "MinIO not ready"; exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        if [ -n "$$MINIO_ACCESS_KEY" ] && [ -n "$$MINIO_SECRET_KEY" ]; then
          mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" || true
          mc admin policy attach local readwrite --user "$$MINIO_ACCESS_KEY" || true
        fi
        echo "MinIO ready: bucket=$$MINIO_BUCKET"
    restart: "no"

volumes:
  minio_data:
