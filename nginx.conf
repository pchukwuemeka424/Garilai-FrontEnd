# Container nginx — serves Next.js static export (out/)
server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Next export: /path → /path.html or /path/index.html
	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
		expires 7d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Health for Coolify / load balancers
	location = /healthz {
		access_log off;
		return 200 "ok\n";
		add_header Content-Type text/plain;
	}
}
